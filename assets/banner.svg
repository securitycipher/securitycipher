<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="SecurityCipher">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="45%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6d7bff"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d7bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#272b36" stroke-width="1" opacity="0.55"/>
    </pattern>
    <radialGradient id="orb1" cx="30%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#6d7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="78%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#orb1)"/>
  <rect width="1400" height="420" fill="url(#orb2)"/>
  <rect width="1400" height="420" fill="url(#grid)" opacity="0.55"/>

  <!-- soft floating shapes -->
  <circle cx="180" cy="90" r="90" fill="#6d7bff" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1220" cy="320" r="120" fill="#a855f7" opacity="0.10" filter="url(#soft)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="420" fill="url(#accent)"/>

  <!-- cipher glyphs subtle -->
  <g fill="#c6ccd8" opacity="0.08" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <text x="70" y="70">0x41</text>
    <text x="1180" y="80">SSH</text>
    <text x="1080" y="360">JWT</text>
    <text x="90" y="360">IAM</text>
    <text x="1260" y="180">XSS</text>
    <text x="200" y="200">RAG</text>
  </g>

  <!-- brand mark -->
  <g transform="translate(78,138)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#15171f" stroke="#272b36" stroke-width="2"/>
    <rect x="10" y="10" width="52" height="52" rx="12" fill="url(#accent)" opacity="0.18"/>
    <path d="M36 18 L52 28 V44 L36 54 L20 44 V28 Z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="36" cy="36" r="5" fill="#c084fc"/>
  </g>

  <text x="176" y="178" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-0.5">SecurityCipher</text>
  <text x="176" y="226" fill="#78838f" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Practical cybersecurity education · Bug bounty · AppSec · Cloud &amp; AI</text>

  <!-- chips -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="176" y="258" width="118" height="34" rx="17" fill="#15171f" stroke="#272b36"/>
    <text x="235" y="280" text-anchor="middle" fill="#c6ccd8">Pentesting</text>

    <rect x="308" y="258" width="126" height="34" rx="17" fill="#15171f" stroke="#272b36"/>
    <text x="371" y="280" text-anchor="middle" fill="#c6ccd8">Bug Bounty</text>

    <rect x="448" y="258" width="148" height="34" rx="17" fill="#15171f" stroke="#272b36"/>
    <text x="522" y="280" text-anchor="middle" fill="#c6ccd8">Cloud Security</text>

    <rect x="610" y="258" width="132" height="34" rx="17" fill="#15171f" stroke="#272b36"/>
    <text x="676" y="280" text-anchor="middle" fill="#c6ccd8">AI / LLM Sec</text>

    <rect x="756" y="258" width="118" height="34" rx="17" fill="#15171f" stroke="#272b36"/>
    <text x="815" y="280" text-anchor="middle" fill="#c6ccd8">DevSecOps</text>
  </g>

  <!-- bottom gradient line -->
  <rect x="0" y="412" width="1400" height="8" fill="url(#accent)"/>
</svg>
